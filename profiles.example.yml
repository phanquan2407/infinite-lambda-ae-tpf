infinite_lambda_ecommerce:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: oauth
      project: YOUR_GCP_PROJECT_ID
      dataset: dbt_yourname_dev
      location: US
      threads: 4
      priority: interactive
      job_execution_timeout_seconds: 300
      job_retries: 1
    prod:
      type: bigquery
      method: service-account
      project: "{{ env_var('DBT_GCP_PROJECT_ID') }}"
      dataset: analytics
      location: US
      threads: 4
      keyfile: "{{ env_var('GOOGLE_APPLICATION_CREDENTIALS') }}"

